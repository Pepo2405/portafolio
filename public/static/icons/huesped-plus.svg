<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <linearGradient id="hpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="0.55" stop-color="#7b5cf0"/>
      <stop offset="1" stop-color="#2f3ea8"/>
    </linearGradient>
    <linearGradient id="hpScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#dbe3fb"/>
    </linearGradient>
    <linearGradient id="hpBubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
  </defs>

  <rect width="240" height="160" fill="url(#hpBg)"/>
  <!-- halo -->
  <circle cx="120" cy="86" r="62" fill="#ffffff" opacity="0.09"/>
  <circle cx="120" cy="86" r="42" fill="#ffffff" opacity="0.07"/>

  <!-- llave digital / acceso, a la izquierda -->
  <g transform="translate(30 50)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.95"/>
    <path d="M-6 -1a6 6 0 1 1 6 6" fill="none" stroke="#5b46d6" stroke-width="3.4"
          stroke-linecap="round"/>
    <path d="M0 5v9M0 10h5" stroke="#5b46d6" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- teléfono -->
  <g transform="translate(96 22)">
    <rect x="0" y="0" width="72" height="116" rx="11" fill="#1b2036" opacity="0.9"/>
    <rect x="4" y="6" width="64" height="104" rx="8" fill="url(#hpScreen)"/>
    <rect x="26" y="10" width="20" height="3" rx="1.5" fill="#1b2036" opacity="0.35"/>
    <!-- header de la app -->
    <rect x="11" y="20" width="30" height="4" rx="2" fill="#3b4a86" opacity="0.8"/>
    <rect x="11" y="28" width="44" height="3" rx="1.5" fill="#8f9bc9"/>
    <!-- tarjetas -->
    <rect x="11" y="38" width="50" height="14" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="15" y="43" width="26" height="4" rx="2" fill="#7c8bc4"/>
    <rect x="11" y="56" width="50" height="14" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="15" y="61" width="20" height="4" rx="2" fill="#7c8bc4"/>
    <!-- botón de acción -->
    <rect x="11" y="76" width="50" height="15" rx="7.5" fill="#5b46d6"/>
    <rect x="24" y="82" width="24" height="3.4" rx="1.7" fill="#ffffff"/>
    <!-- home indicator -->
    <rect x="28" y="99" width="16" height="3" rx="1.5" fill="#1b2036" opacity="0.3"/>
  </g>

  <!-- burbuja del concierge IA -->
  <g transform="translate(150 30)">
    <path d="M0 8a8 8 0 0 1 8-8h44a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H22l-11 10V42H8a8 8 0 0 1-8-8z"
          fill="url(#hpBubble)" stroke="#4f5fb8" stroke-width="1.6"/>
    <!-- chispa IA -->
    <path d="M22 10l2.6 6.4L31 19l-6.4 2.6L22 28l-2.6-6.4L13 19l6.4-2.6z" fill="#7b5cf0"/>
    <rect x="38" y="13" width="14" height="3.2" rx="1.6" fill="#8f9bc9"/>
    <rect x="38" y="20" width="10" height="3.2" rx="1.6" fill="#b9c2e0"/>
  </g>
</svg>
